<div class="whats-new-wrap">
  <section class="whats-new-card">
    <div class="whats-new-kicker">{{ app_name }} {{ app_version }}</div>
    <h2 class="whats-new-title" data-i18n="whatsNew.fallbackTitle">What's New?</h2>
    <p class="whats-new-copy" data-i18n="whatsNew.fallbackCopy">
      A detailed changelog template is not available for this version yet, but the app detected a new build.
    </p>
  </section>
  <section class="whats-new-footer">
    <div class="whats-new-meta">
      <span>{{ app_name }} {{ app_version }}</span>
      <span>{{ app_license_code }}</span>
    </div>
    <label class="whats-new-startup-toggle">
      <strong data-i18n="whatsNew.showOnStartup">Show on startup</strong>
      <span class="switch">
        <input id="whats-new-startup-toggle" type="checkbox" checked>
        <span class="slider"></span>
      </span>
    </label>
  </section>
</div>
